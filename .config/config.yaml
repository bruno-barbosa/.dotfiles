setup:
  packages:
    shared:
      # Core development tools
      - git
      - git-extras
      - curl
      - wget
      - jq
      - tree
      - htop

      # Shell and terminal
      - zsh
      - tmux
      - fzf

      # Cross-platform prompt + modern CLI (all three OSes)
      - starship
      - zoxide
      - eza
      - bat
      - git-delta

      # Linting for the shell scripts in this repo; the pre-commit hook and
      # CI both run it, and it silently skips where it is missing.
      - shellcheck

    debian:
      # Essential development packages
      - build-essential
      - vim
      - nano

      # Shell and terminal tools
      - ripgrep
      - fd-find

      # System utilities
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - unzip
      - zip
      - xz-utils

      # Development libraries (for building from source).
      #
      # This used to be the pyenv build-dependency list, because pyenv compiles
      # every interpreter from source. uv downloads prebuilt standalone
      # CPythons instead, so the CPython-only headers (libbz2, liblzma,
      # libncurses, libreadline, libsqlite3, libxmlsec1, tk) are gone. What
      # stays is what any native build - a C extension, a Rust crate - still
      # wants. Add the rest back with apt if you ever do compile CPython.
      - python3-dev
      - libffi-dev
      - libssl-dev
      - libxml2-dev
      - zlib1g-dev

      # Additional development tools
      - make
      - cmake
      - pkg-config
      - autoconf
      - automake
      - libtool

      # Network tools
      - net-tools
      - dnsutils
      - telnet
      - openssh-client
      - rsync

      # Media and file handling
      - ffmpeg
      - imagemagick
      - pandoc

      # Text processing
      - gawk   # "awk" is a virtual package in Debian; gawk is the real one
      - sed
      - grep
      - less

    # Installed only when the installer detects WSL (see bin/platform/unix.sh).
    # These are plain Debian packages -- they are kept out of the debian list
    # so a native Linux box does not pull in Windows-interop tooling.
    wsl:
      # wslview: the xdg-open WSL lacks, hands URLs to the Windows default
      # browser. Kept here for the releases that still carry it -- Ubuntu
      # dropped wslu (gone in 26.04, and ubuntu-wsl no longer depends on it),
      # where unix_install reports a clean skip. bin/wsl/wsl-open covers
      # those boxes instead; see .zsh/.wsl.zsh.
      - wslu

    osx:
      # Development utilities
      - gh

      # Nerd Font for the starship prompt glyphs
      - font-maple-mono-nf
      - docker
      - docker-compose
      - kubernetes-cli
      - rustup-init
      - awscli

      # Text editors and IDEs (GUI apps - will be installed as casks)
      - visual-studio-code

      # Browsers (GUI apps - will be installed as casks)
      - google-chrome

      # Productivity apps (GUI apps - will be installed as casks)
      - raycast
      - ghostty

      # Media and graphics (GUI apps - will be installed as casks)
      - vlc
      - imageoptim

      # System utilities (GUI apps - will be installed as casks)
      - appcleaner
      - the-unarchiver

    windows:
      # installed via scoop (main bucket unless noted)
      - git
      - gh
      - starship
      - fzf
      - zoxide
      - eza
      - bat
      - delta
      - ripgrep
      - fd
      - jq
      - less
      - shellcheck
      # Python toolchain: uv installs and pins CPython itself, so there is no
      # separate python entry here. The Unix arm installs it in bin/python/.
      - uv
      # nerd-fonts bucket
      - MapleMono-NF
    gems:
      - bundler
      - rake
      - rubocop
      - pry
      - rspec

    # Global Python CLI tools, installed with `uv tool install` -- each one
    # lands in its own isolated environment, like pipx.
    #
    # This is deliberately tools only, not libraries. pip/setuptools/wheel/
    # virtualenv are gone because uv provides all four itself, and libraries
    # (requests, numpy, pandas) belong to a project: `uv add numpy` inside it,
    # or `uv run --with numpy python` for a one-off.
    python:
      - ruff
      - black
      - flake8
      - pytest
      - jupyter
      - httpie

    node:
      - npm
      - yarn
      - typescript
      - eslint
      - prettier
      - nodemon